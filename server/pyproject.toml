[project]
name = "aember-fleet"
version = "0.1.0"
description = "Fleet server for aember devices: registry, signed container releases, rollout"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn", "cryptography"]

[project.scripts]
aember-fleet = "aember_fleet.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["aember_fleet"]

# Mutation testing (mutmut, in Dockerfile.mutation): `docker build -f
# Dockerfile.mutation -t aember-fleet-mutation . && docker run --rm aember-fleet-mutation`
[tool.mutmut]
source_paths = ["aember_fleet/"]
also_copy = ["tools/"]  # tests/test_mutation_report.py loads tools/mutation.py
pytest_add_cli_args_test_selection = ["tests/"]
