name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Agent unit tests (x64 SDK) and CLI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: SDK version
        id: sdk
        run: echo "version=$(sed -n 's/^RESOURCES_VERSION = "\(.*\)"/\1/p' aember-cli/run.py)" >> "$GITHUB_OUTPUT"
      # The x64 aember-resources SDK (~650 MB installer, ~4 GB installed):
      # cached per release version.
      - uses: actions/cache@v4
        with:
          path: build/aember-resources/x64-poky-linux/sdk
          key: aember-sdk-x64-poky-linux-v${{ steps.sdk.outputs.version }}
      - name: SDK
        run: python3 aember-cli/run.py sdk -a x64-poky-linux
      - name: Tests
        run: python3 aember-cli/run.py test

  server:
    name: Server tests (pytest in Docker)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: |
          docker build -f server/Dockerfile.test -t aember-fleet-test server
          docker run --rm aember-fleet-test
      - name: Image
        run: docker build -t aember-fleet server

  tla:
    name: TLA+ model of the update (TLC)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/aember-tla
          key: tla2tools-${{ hashFiles('spec/tla/check.sh') }}
      - name: Model-check
        run: spec/tla/check.sh

  fuzz:
    name: Fuzz (libFuzzer + ASan/UBSan, 60 s per target)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: >-
          sudo apt-get update && sudo apt-get install -y clang-18 llvm-18
          libclang-rt-18-dev ninja-build pkg-config libwolfssl-dev
          nlohmann-json3-dev
      # The corpus grows from run to run: what the fuzzer found is kept.
      - uses: actions/cache@v4
        with:
          path: build/fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Fuzz
        run: fuzz/run.sh 60
      - name: Crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: |
            build/fuzz/crashes
            build/fuzz/*.log
